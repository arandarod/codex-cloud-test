services:
  db:
    image: postgres:18.3
    environment:
      POSTGRES_DB: devdb
      POSTGRES_USER: ${DB_USER:?Defina DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - catalog-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d devdb"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  catalog-data:
